app = "glass-pbm-demo"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# The seeded book is too large to ship inside every image. It lives here, and
# is updated with `node scripts/push-book.mjs` when the local book changes.
[mounts]
  source = "glass_book"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Kept warm on purpose: a cold start in front of an audience is not worth
  # the few dollars a month it saves.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Without this a deploy reports success as soon as the machine is created,
  # which it will do even if the app cannot read the book. The probe queries
  # the rollup, so passing means the dashboards can render.
  [[http_service.checks]]
    interval = "30s"
    timeout = "30s"
    grace_period = "120s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  # The seeded book is a ~1.3 GB SQLite file. Queries read the daily rollup
  # rather than the claim table, so this is page cache rather than working set,
  # but leaving room for it is the difference between a dashboard that answers
  # instantly and one that goes to disk while an audience watches.
  memory = "4gb"
