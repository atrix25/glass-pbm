# Glass — single-tenant production (Fly)
app = "glass-pbm-demo"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# Stateless app + async worker. Database is networked Postgres (DATABASE_URL).
# No volume mount — the SQLite book file is retired.

[processes]
  app = "node /app/server.js"
  worker = "node /app/scripts/worker-entry.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "30s"
    grace_period = "180s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["worker"]
